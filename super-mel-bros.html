<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Mel Bros</title>
<style>
:root{--bg:#fff3cf;--ink:#4a2a08;--btn:#f2a900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1507;--ink:#ffe7a8;--btn:#f2b13a}}
:root[data-theme="dark"]{--bg:#1f1507;--ink:#ffe7a8;--btn:#f2b13a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1{margin:4px 0;font-size:1.35rem;text-align:center}
.wrap{position:relative;width:min(100%,900px)}
canvas{width:100%;aspect-ratio:2/1;display:block;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);background:#9fdcff}
.win{position:absolute;inset:0;background:rgba(40,20,0,.55);border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:clamp(1.2rem,5vw,2rem);font-weight:800}
.win[hidden]{display:none}
.pad{width:min(100%,900px);display:flex;justify-content:space-between;align-items:flex-start;margin-top:-4px;padding:0 10px 6px;touch-action:none;position:relative;z-index:5}
.pad .dpad{display:flex;gap:8px;margin-top:2px}
.pad .actions{display:flex;gap:14px;align-items:flex-start;margin-top:0}
button{font:inherit;font-weight:800;font-size:1.1rem;background:var(--btn);color:#3a2000;border:0;border-radius:50%;width:54px;height:54px;min-width:54px;padding:0;touch-action:none;cursor:pointer;box-shadow:0 4px 0 #b87a00}
button.on{filter:brightness(.85);transform:translateY(3px);box-shadow:0 1px 0 #b87a00}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.jump{width:62px;height:62px;min-width:62px;font-size:.95rem;background:#e85d4c;color:#fff;box-shadow:0 4px 0 #a33}
.jump.on{box-shadow:0 1px 0 #a33}
button[data-k="a"]{background:#4a9fef;color:#fff;box-shadow:0 4px 0 #2868a8}
button[data-k="a"].on{box-shadow:0 1px 0 #2868a8}
.mute{position:absolute;top:8px;right:8px;min-width:46px;height:46px;width:46px;font-size:1.2rem;padding:0;border-radius:12px;opacity:.9;box-shadow:none}
.lv{display:none!important}
.note{margin:2px 0 0;font-size:.78rem;opacity:.7;text-align:center;max-width:900px}
h1{margin:2px 0 4px;font-size:1.15rem}
#start{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:linear-gradient(#7fd4ff,#fff6d4 55%,#f2a900);text-align:center}
#start[hidden]{display:none}
.logo{margin:0;font-size:clamp(2.6rem,11vw,5rem);line-height:.9;font-weight:900;color:#f6b400;letter-spacing:.02em;-webkit-text-stroke:6px #4a2a08;paint-order:stroke fill;text-shadow:0 8px 0 #8a4a12}
.logo small{display:block;margin-top:10px;font-size:.38em;-webkit-text-stroke:3px #4a2a08}
#go{width:auto;height:auto;min-width:220px;border-radius:18px;padding:16px 22px;font-size:1.25rem;box-shadow:0 6px 0 #b87a00}
body.fs{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;padding:0;overflow:hidden}
body.fs h1,body.fs .note{display:none}
body.fs .wrap{flex:1 1 auto;width:100%;height:100%;min-height:0}
body.fs canvas{width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none}
body.fs .pad{position:absolute;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));z-index:6;margin:0}
:fullscreen,:-webkit-full-screen{background:#1f1507}
</style>
</head>
<body>
<div id="start">
<p class="logo">SUPER<br>MEL BROS<small>🍯 o resgate do Ewerton</small></p>
<button id="go" type="button">Clique aqui para iniciar</button>
</div>
<h1>Super Mel Bros 🍯</h1>
<div class="lv" id="lv"></div>
<div class="wrap">
<canvas id="c" role="img" aria-label="Jogo de plataforma com ela de pijama do Pooh coletando potes de mel em 10 fases"></canvas>
<button class="mute" id="mute" aria-label="Ligar ou desligar o som">🔊</button>
<div class="win" id="win" hidden><div id="wt">Fase completa!</div><button id="again">Próxima fase</button></div>
</div>
<div class="pad">
<div class="dpad"><button data-k="l" aria-label="Esquerda">◀</button><button data-k="r" aria-label="Direita">▶</button></div>
<div class="actions"><button data-k="a" aria-label="Usar poder (chinelo)">🩴</button><button data-k="j" class="jump">A</button></div>
</div>
<p class="note">Teclado: setas ou A/D andam, espaço pula, X usa o chinelo. Pegue os poderes pelo caminho!</p>

let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(50,t-last);last=t;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyX:'a',KeyZ:'a',Enter:'a',KeyF:'a'};
addEventListener('keydown',e=>{const k=km[e.code];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=km[e.code];if(k)keys[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{
 const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on')},off=()=>{keys[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));
});

addEventListener('pointerdown',wake);addEventListener('keydown',wake);

function goFS(){
 const el=document.documentElement;
 const req=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitEnterFullscreen;
 document.body.classList.add('fs');
 if(req)req.call(el).catch(()=>{});
 try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
 setTimeout(()=>scrollTo(0,1),80);
}

});
